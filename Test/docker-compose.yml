services:
  meta-avatar-duui:
    build: .
    image: meta-avatar-duui:latest
    # mediapipe 0.10.21 ships Linux wheels for x86_64 only. On Apple Silicon
    # the container runs under emulation, which makes TripoSR much slower.
    platform: linux/amd64
    ports:
      - "8000:9714"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      META_AVATAR_PUBLIC_BASE_URL: ${META_AVATAR_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      META_AVATAR_OLLAMA_TEXT_MODEL: ${META_AVATAR_OLLAMA_TEXT_MODEL:-qwen3.5:0.8b}
      META_AVATAR_MC_RESOLUTION: ${META_AVATAR_MC_RESOLUTION:-256}
      META_AVATAR_OFFLINE: ${META_AVATAR_OFFLINE:-0}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
    volumes:
      - meta-avatar-models:/data/models
      # Prepared once on the host with prepare_local_models.py.
      - ./backend_python/local_models:/app/local_models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  meta-avatar-models:
